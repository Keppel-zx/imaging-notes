<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">流水线的顺序，必须与参数的定义一起理解</title><desc id="desc">自绘教学示意，非实验数据。流水线的顺序，必须与参数的定义一起理解</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#146e6e"/></marker><radialGradient id="shade"><stop offset="0" stop-color="#faf7da"/><stop offset="1" stop-color="#485b55"/></radialGradient><radialGradient id="gain"><stop offset="0" stop-color="#9ecdc5"/><stop offset="1" stop-color="#f2d29f"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="3"/></filter></defs><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#182e35}.t{font-size:23px;font-weight:650}.s{font-size:18px;fill:#5e7478}.a{stroke:#5e7478;stroke-width:1.5;fill:none}.l{stroke:#146e6e;stroke-width:3;fill:none}.g{stroke:#c28a35;stroke-width:3;fill:none}.box{fill:#edf3ed;stroke:#b5ccc1;stroke-width:1.5}.num{font-size:25px;fill:#146e6e}</style><rect width="900" height="430" rx="18" fill="#fbfaf6"/><text class="t" x="35" y="42">流水线的顺序，必须与参数的定义一起理解</text><text class="s" x="40" y="95" text-anchor="start">示例输入 x=100 DN，黑位 b=10 DN，增益 g=2</text><rect class="box" x="40" y="130" width="100" height="65" rx="8"/><text class="num" x="90" y="172" text-anchor="middle">100</text><path class="l" d="M145,163L200,163" marker-end="url(#arrow)"/><rect class="box" x="205" y="130" width="160" height="65" rx="8"/><text class="t" x="285" y="171" text-anchor="middle">扣黑</text><path class="l" d="M370,163L420,163" marker-end="url(#arrow)"/><rect class="box" x="425" y="130" width="100" height="65" rx="8"/><text class="num" x="475" y="171" text-anchor="middle">90</text><path class="l" d="M530,163L585,163" marker-end="url(#arrow)"/><rect class="box" x="590" y="130" width="150" height="65" rx="8"/><text class="t" x="665" y="171" text-anchor="middle">增益×2</text><text class="num" x="775" y="172" text-anchor="start">180 DN</text><rect class="box" x="40" y="260" width="100" height="65" rx="8"/><text class="num" x="90" y="302" text-anchor="middle">100</text><path class="l" d="M145,293L200,293" marker-end="url(#arrow)"/><rect class="box" x="205" y="260" width="160" height="65" rx="8"/><text class="t" x="285" y="301" text-anchor="middle">增益×2</text><path class="l" d="M370,293L420,293" marker-end="url(#arrow)"/><rect class="box" x="425" y="260" width="100" height="65" rx="8"/><text class="num" x="475" y="301" text-anchor="middle">200</text><path class="l" d="M530,293L585,293" marker-end="url(#arrow)"/><rect class="box" x="590" y="260" width="150" height="65" rx="8"/><text class="t" x="665" y="301" text-anchor="middle">减原黑位</text><text class="num" x="775" y="302" text-anchor="start">190 DN</text><text class="s" x="40" y="375" text-anchor="start">重排操作后若不相应变换标定参数，输出就不等价</text><text class="s" x="35" y="410">自绘教学示意 · 非实验数据</text></svg>