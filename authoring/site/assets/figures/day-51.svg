<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title"><title id="title">不同 RGB-D 路线：比较误差传递，而非直接排列规格</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#146e6e"/></marker></defs><rect width="900" height="450" fill="#fbfaf6"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="38" font-size="25" fill="#182e35" text-anchor="start" font-weight="650">不同 RGB-D 路线：比较误差传递，而非直接排列规格</text><rect x="30" y="80" width="265" height="285" rx="10" fill="#edf3ed" stroke="none"/><text x="162" y="125" font-size="23" fill="#182e35" text-anchor="middle" font-weight="650">三角测量</text><text x="162" y="198" font-size="20" fill="#146e6e" text-anchor="middle" font-weight="400">|∂z/∂d| = z²/(bf)</text><text x="45" y="260" font-size="17" fill="#182e35" text-anchor="start" font-weight="400">输入扰动：视差 δd [px]</text><text x="45" y="322" font-size="16" fill="#5e7478" text-anchor="start" font-weight="400">几何灵敏度随 z² 增长</text><rect x="318" y="80" width="265" height="285" rx="10" fill="#edf3ed" stroke="none"/><text x="450" y="125" font-size="23" fill="#182e35" text-anchor="middle" font-weight="650">iToF</text><text x="450" y="198" font-size="20" fill="#146e6e" text-anchor="middle" font-weight="400">∂r/∂φ = c/(4πfₘ)</text><text x="333" y="260" font-size="17" fill="#182e35" text-anchor="start" font-weight="400">输入扰动：相位 δφ [rad]</text><text x="333" y="322" font-size="16" fill="#5e7478" text-anchor="start" font-weight="400">还要检查周期歧义与多径</text><rect x="606" y="80" width="265" height="285" rx="10" fill="#edf3ed" stroke="none"/><text x="738" y="125" font-size="23" fill="#182e35" text-anchor="middle" font-weight="650">dToF</text><text x="738" y="198" font-size="20" fill="#146e6e" text-anchor="middle" font-weight="400">∂r/∂τ = c/2</text><text x="621" y="260" font-size="17" fill="#182e35" text-anchor="start" font-weight="400">输入扰动：时间 δτ [s]</text><text x="621" y="322" font-size="16" fill="#5e7478" text-anchor="start" font-weight="400">还要检查抖动、偏置与堆积</text><text x="450" y="395" font-size="21" fill="#182e35" text-anchor="middle" font-weight="400">统一成米之后，仍需统一场景、曝光和误差定义再比较</text><text x="35" y="432" font-size="15" fill="#5e7478" text-anchor="start" font-weight="400">自绘教学示意 · 非实验数据；几何及波形未按比例绘制</text></g></svg>