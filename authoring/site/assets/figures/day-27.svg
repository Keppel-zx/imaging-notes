<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">排名能说明顺序，却不能说明“好多少”</title><desc id="desc">自绘教学示意，非实验数据。排名能说明顺序，却不能说明“好多少”</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#146e6e"/></marker><radialGradient id="shade"><stop offset="0" stop-color="#faf7da"/><stop offset="1" stop-color="#485b55"/></radialGradient><radialGradient id="gain"><stop offset="0" stop-color="#9ecdc5"/><stop offset="1" stop-color="#f2d29f"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="3"/></filter></defs><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#182e35}.t{font-size:23px;font-weight:650}.s{font-size:18px;fill:#5e7478}.a{stroke:#5e7478;stroke-width:1.5;fill:none}.l{stroke:#146e6e;stroke-width:3;fill:none}.g{stroke:#c28a35;stroke-width:3;fill:none}.box{fill:#edf3ed;stroke:#b5ccc1;stroke-width:1.5}.num{font-size:25px;fill:#146e6e}</style><rect width="900" height="430" rx="18" fill="#fbfaf6"/><text class="t" x="35" y="42">排名能说明顺序，却不能说明“好多少”</text><text class="t" x="45" y="95" text-anchor="start">两组标记具有相同的 A ≻ B ≻ C 顺序</text><text class="s" x="45" y="148" text-anchor="start">示意排列一</text><path class="a" d="M90,175L780,175"/><circle cx="120" cy="175" r="19" fill="#146e6e"/><text x="120" y="182" font-size="19" fill="#ffffff" text-anchor="middle" style="fill:#fff">A</text><circle cx="270" cy="175" r="19" fill="#146e6e"/><text x="270" y="182" font-size="19" fill="#ffffff" text-anchor="middle" style="fill:#fff">B</text><circle cx="420" cy="175" r="19" fill="#146e6e"/><text x="420" y="182" font-size="19" fill="#ffffff" text-anchor="middle" style="fill:#fff">C</text><text class="s" x="45" y="258" text-anchor="start">示意排列二</text><path class="a" d="M90,285L780,285"/><circle cx="120" cy="285" r="19" fill="#146e6e"/><text x="120" y="292" font-size="19" fill="#ffffff" text-anchor="middle" style="fill:#fff">A</text><circle cx="180" cy="285" r="19" fill="#146e6e"/><text x="180" y="292" font-size="19" fill="#ffffff" text-anchor="middle" style="fill:#fff">B</text><circle cx="650" cy="285" r="19" fill="#146e6e"/><text x="650" y="292" font-size="19" fill="#ffffff" text-anchor="middle" style="fill:#fff">C</text><text class="s" x="45" y="365" text-anchor="start">顺序量表只规定先后；间距需要额外的心理物理实验与模型</text><text class="s" x="35" y="410">自绘教学示意 · 非实验数据</text></svg>