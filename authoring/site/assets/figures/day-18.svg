<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">白平衡校正的是通道比值，而非全部颜色</title><desc id="desc">自绘教学示意，非实验数据。白平衡校正的是通道比值，而非全部颜色</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#146e6e"/></marker><radialGradient id="shade"><stop offset="0" stop-color="#faf7da"/><stop offset="1" stop-color="#485b55"/></radialGradient><radialGradient id="gain"><stop offset="0" stop-color="#9ecdc5"/><stop offset="1" stop-color="#f2d29f"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="3"/></filter></defs><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#182e35}.t{font-size:23px;font-weight:650}.s{font-size:18px;fill:#5e7478}.a{stroke:#5e7478;stroke-width:1.5;fill:none}.l{stroke:#146e6e;stroke-width:3;fill:none}.g{stroke:#c28a35;stroke-width:3;fill:none}.box{fill:#edf3ed;stroke:#b5ccc1;stroke-width:1.5}.num{font-size:25px;fill:#146e6e}</style><rect width="900" height="440" rx="18" fill="#fbfaf6"/><text class="t" x="35" y="42">白平衡校正的是通道比值，而非全部颜色</text><text class="t" x="70" y="90" text-anchor="start">照明在传感器中的相对响应</text><text class="t" x="520" y="90" text-anchor="start">对角增益后：无彩目标中性化</text><rect x="90" y="225.0" width="55" height="75.0" fill="#d99687"/><text class="t" x="118" y="330" text-anchor="middle">R</text><rect x="550" y="150" width="55" height="150" fill="#d99687"/><text class="t" x="578" y="330" text-anchor="middle">R</text><rect x="185" y="150" width="55" height="150" fill="#86b5a0"/><text class="t" x="213" y="330" text-anchor="middle">G</text><rect x="645" y="150" width="55" height="150" fill="#86b5a0"/><text class="t" x="673" y="330" text-anchor="middle">G</text><rect x="280" y="262.5" width="55" height="37.5" fill="#8baec6"/><text class="t" x="308" y="330" text-anchor="middle">B</text><rect x="740" y="150" width="55" height="150" fill="#8baec6"/><text class="t" x="768" y="330" text-anchor="middle">B</text><path class="l" d="M390,220L490,220" marker-end="url(#arrow)"/><text class="s" x="440" y="180" text-anchor="middle">通道缩放</text><text class="s" x="440" y="255" text-anchor="middle">2 / 1 / 4</text><text class="s" x="70" y="375" text-anchor="start">示例相对响应 0.5 / 1 / 0.25；缩放不保证任意有色材料都被正确还原</text><text class="s" x="35" y="420">自绘教学示意 · 非实验数据</text></svg>