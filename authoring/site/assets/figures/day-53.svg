<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">从任务反推传感器：先求可行窗口，再比较参数</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#146e6e"/></marker></defs><rect width="900" height="440" fill="#fbfaf6"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="38" font-size="25" fill="#182e35" text-anchor="start" font-weight="650">从任务反推传感器：先求可行窗口，再比较参数</text><rect x="30" y="75" width="840" height="280" rx="10" fill="#edf3ed" stroke="none"/><rect x="300" y="140" width="360" height="165" rx="0" fill="#dcebe3" stroke="none"/><line x1="80" y1="305" x2="825" y2="305" stroke="#5e7478" stroke-width="3" marker-end="url(#arr)"/><line x1="300" y1="125" x2="300" y2="320" stroke="#146e6e" stroke-width="3" stroke-dasharray="6 4"/><line x1="660" y1="125" x2="660" y2="320" stroke="#c28a35" stroke-width="3" stroke-dasharray="6 4"/><text x="180" y="190" font-size="25" fill="#5e7478" text-anchor="middle" font-weight="400">信号不足</text><text x="480" y="190" font-size="25" fill="#146e6e" text-anchor="middle" font-weight="400">可用工作窗口</text><text x="750" y="190" font-size="21" fill="#c28a35" text-anchor="middle" font-weight="400">饱和 / 剪切</text><text x="300" y="345" font-size="21" fill="#146e6e" text-anchor="middle" font-weight="400">Nreq</text><text x="660" y="345" font-size="21" fill="#c28a35" text-anchor="middle" font-weight="400">Nsat</text><text x="482" y="250" font-size="18" fill="#182e35" text-anchor="middle" font-weight="400">目标 SNR、帧率、波长和温度必须同时满足</text><text x="690" y="390" font-size="21" fill="#182e35" text-anchor="start" font-weight="400">输入信号电子数 N</text><text x="75" y="110" font-size="19" fill="#5e7478" text-anchor="start" font-weight="400">低端由噪声预算约束，高端由当前模式的饱和容量约束</text><text x="35" y="422" font-size="15" fill="#5e7478" text-anchor="start" font-weight="400">自绘教学示意 · 非实验数据；几何及波形未按比例绘制</text></g></svg>