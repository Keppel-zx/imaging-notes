<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">系统诊断：曲线形状提出假设，数据域对照检验假设</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#146e6e"/></marker></defs><rect width="900" height="440" fill="#fbfaf6"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="38" font-size="25" fill="#182e35" text-anchor="start" font-weight="650">系统诊断：曲线形状提出假设，数据域对照检验假设</text><rect x="30" y="70" width="530" height="315" rx="10" fill="#edf3ed" stroke="none"/><line x1="95" y1="330" x2="520" y2="330" stroke="#5e7478" stroke-width="2" marker-end="url(#arr)"/><line x1="95" y1="330" x2="95" y2="110" stroke="#5e7478" stroke-width="2" marker-end="url(#arr)"/><line x1="110" y1="280" x2="510" y2="280" stroke="#146e6e" stroke-width="3"/><line x1="110" y1="310" x2="510" y2="135" stroke="#c28a35" stroke-width="3"/><line x1="250" y1="325" x2="480" y2="95" stroke="#a74432" stroke-width="3"/><text x="302" y="273" font-size="18" fill="#146e6e" text-anchor="start" font-weight="400">读出：斜率 0</text><text x="275" y="220" font-size="18" fill="#c28a35" text-anchor="start" font-weight="400">散粒：斜率 1/2</text><text x="335" y="105" font-size="17" fill="#a74432" text-anchor="start" font-weight="400">空间响应项：斜率 1</text><text x="305" y="365" font-size="18" fill="#182e35" text-anchor="middle" font-weight="400">信号 N（对数刻度）</text><text x="105" y="95" font-size="17" fill="#182e35" text-anchor="start" font-weight="400">噪声 rms（对数刻度）</text><rect x="585" y="70" width="285" height="315" rx="10" fill="#edf3ed" stroke="none"/><text x="605" y="111" font-size="21" fill="#182e35" text-anchor="start" font-weight="650">定位最早异常的数据域</text><text x="610" y="165" font-size="22" fill="#182e35" text-anchor="start" font-weight="400">RAW / 扣黑</text><line x1="700" y1="180" x2="700" y2="215" stroke="#146e6e" stroke-width="2" marker-end="url(#arr)"/><tex