<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">从深度图到点云：不要把径向距离直接当作 z</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#146e6e"/></marker></defs><rect width="900" height="440" fill="#fbfaf6"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="38" font-size="25" fill="#182e35" text-anchor="start" font-weight="650">从深度图到点云：不要把径向距离直接当作 z</text><rect x="30" y="70" width="410" height="300" rx="10" fill="#edf3ed" stroke="none"/><rect x="465" y="70" width="405" height="300" rx="10" fill="#edf3ed" stroke="none"/><circle cx="95" cy="310" r="7" fill="#146e6e"/><line x1="95" y1="310" x2="385" y2="310" stroke="#5e7478" stroke-width="2" marker-end="url(#arr)"/><text x="394" y="315" font-size="20" fill="#182e35" text-anchor="start" font-weight="400">z</text><line x1="95" y1="310" x2="350" y2="130" stroke="#146e6e" stroke-width="4"/><line x1="350" y1="130" x2="350" y2="310" stroke="#c28a35" stroke-width="3" stroke-dasharray="7 5"/><circle cx="350" cy="130" r="8" fill="#c28a35"/><text x="230" y="200" font-size="24" fill="#146e6e" text-anchor="start" font-weight="400">r</text><text x="200" y="340" font-size="20" fill="#182e35" text-anchor="start" font-weight="400">轴向深度 z</text><text x="270" y="125" font-size="20" fill="#182e35" text-anchor="start" font-weight="400">P(x,y,z)</text><text x="52" y="102" font-size="20" fill="#182e35" text-anchor="start" font-weight="650">边缘视线：径向 r 大于轴向 z</text><text x="490" y="102" font-size="20" fill="#182e35" text-anchor="start" font-weight="650">反投影：每个像素定义一条射线</text><circle cx="510" cy="250" r="5" fill="#146e6e"/><circle cx="560" cy="220" r="5" fill="#146e6e"/><circle cx="605" cy="190" r="5" fill="#146e6e"/><circle cx="665" cy="170" r="5" fill="#146e6e"/><circle cx="705" cy="140" r="5" fill="#146e6e"/><circle cx="755" cy="120" r="5" fill="#146e6e"/><circle cx="800" cy="100" r="5" fill="#146e6e"/><circle cx="550" cy="290" r="5" fill="#146e6e"/><circle cx="625" cy="265" r="5" fill="#146e6e"/><circle cx="700" cy="240" r="5" fill="#146e6e"/><circle cx="775" cy="215" r="5" fill="#146e6e"/><line x1="520" y1="330" x2="825" y2="330" stroke="#5e7478" stroke-width="2" marker-end="url(#arr)"/><line x1="520" y1="330" x2="520" y2="135" stroke="#5e7478" stroke-width="2" marker-end="url(#arr)"/><text x="803" y="355" font-size="20" fill="#182e35" text-anchor="start" font-weight="400">x</text><text x="500" y="138" font-size="20" fill="#182e35" text-anchor="start" font-weight="400">z</text><text x="530" y="353" font-size="16" fill="#5e7478" text-anchor="start" font-weight="400">点云来自射线 + 正确的距离定义</text><text x="35" y="422" font-size="15" fill="#5e7478" text-anchor="start" font-weight="400">自绘教学示意 · 非实验数据；几何及波形未按比例绘制</text></g></svg>