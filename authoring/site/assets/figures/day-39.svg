<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">先确认输出是什么距离，再计算误差</title><desc id="desc">自绘几何示意；对应原书 PDF109 式3.45，非比例绘制</desc><defs><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#146e6e"/></marker><marker id="goldArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#c28a35"/></marker><marker id="inkArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#182e35"/></marker><marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#b15d4f"/></marker></defs><rect width="900" height="450" fill="#fbfaf6"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="35" y="43" font-size="28" fill="#182e35" text-anchor="start" font-weight="700">先确认输出是什么距离，再计算误差</text><text x="35" y="76" font-size="18" fill="#5e7478" text-anchor="start" font-weight="400">自绘几何示意；对应原书 PDF109 式3.45，非比例绘制</text><line x1="200" y1="315" x2="775" y2="315" stroke="#182e35" stroke-width="2" marker-end="url(#inkArrow)"/><line x1="655" y1="105" x2="655" y2="365" stroke="#5e7478" stroke-width="3"/><circle cx="200" cy="315" r="10" fill="#146e6e" stroke="#146e6e" stroke-width="1"/><text x="116" y="352" font-size="22" fill="#182e35" text-anchor="start" font-weight="400">相机中心</text><text x="679" y="119" font-size="22" fill="#5e7478" text-anchor="start" font-weight="400">正对相机的平面</text><line x1="200" y1="315" x2="655" y2="136" stroke="#146e6e" stroke-width="4" marker-end="url(#tealArrow)"/><line x1="200" y1="315" x2="655" y2="315" stroke="#c28a35" stroke-width="4" marker-end="url(#goldArrow)"/><line x1="655" y1="136" x2="655" y2="315" stroke="#5e7478" stroke-width="2" stroke-dasharray="6 5"/><text x="422" y="184" font-size="25" fill="#146e6e" text-anchor="middle" font-weight="400">径向距离 r</text><text x="425" y="354" font-size="25" fill="#c28a35" text-anchor="middle" font-weight="400">光轴深度 z</text><text x="283" y="297" font-size="26" fill="#146e6e" text-anchor="start" font-weight="400">θ</text><text x="450" y="408" font-size="23" fill="#182e35" text-anchor="middle" font-weight="400">z = r cosθ ；离光轴越远，r 与 z 的差异越明显</text></g></svg>