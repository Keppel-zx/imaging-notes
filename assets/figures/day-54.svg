<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title"><title id="title">RGB-D 评价规范：误差、覆盖与工况必须同时记录</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#146e6e"/></marker></defs><rect width="900" height="460" fill="#fbfaf6"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="38" font-size="25" fill="#182e35" text-anchor="start" font-weight="650">RGB-D 评价规范：误差、覆盖与工况必须同时记录</text><rect x="35" y="75" width="340" height="295" rx="10" fill="#edf3ed" stroke="none"/><text x="55" y="110" font-size="22" fill="#182e35" text-anchor="start" font-weight="650">需要覆盖的场景</text><polyline points="80,285 190,145 300,285" fill="none" stroke="#146e6e" stroke-width="2"/><line x1="190" y1="145" x2="190" y2="285" stroke="#c28a35" stroke-width="3"/><text x="202" y="185" font-size="18" fill="#182e35" text-anchor="start" font-weight="400">远 / 近</text><polyline points="65,300 180,300 180,250 315,250" fill="none" stroke="#c28a35" stroke-width="6"/><text x="72" y="345" font-size="18" fill="#5e7478" text-anchor="start" font-weight="400">平面、边缘、多径、明暗目标</text><text x="415" y="103" font-size="23" fill="#182e35" text-anchor="start" font-weight="650">每种工况分别报告</text><rect x="410" y="125" width="445" height="48" rx="10" fill="#edf3ed" stroke="none"/><text x="428" y="156" font-size="19" fill="#146e6e" text-anchor="start" font-weight="650">偏差 b</text><text x="610" y="156" font-size="18" fill="#182e35" text-anchor="start" font-weight="400">均值与真值的距离</text><rect x="410" y="185" width="445" height="48" rx="10" fill="#edf3ed" stroke="none"/><text x="428" y="216" font-size="19" fill="#146e6e" text-anchor="start" font-weight="650">标准差 s</text><text x="610" y="216" font-size="18" fill="#182e35" text-anchor="start" font-weight="400">重复测量的离散</text><rect x="410" y="245" width="445" height="48" rx="10" fill="#edf3ed" stroke="none"/><text x="428" y="276" font-size="19" fill="#146e6e" text-anchor="start" font-weight="650">有效率 V</text><text x="610" y="276" font-size="18" fill="#182e35" text-anchor="start" font-weight="400">有多少区域真正可用</text><rect x="410" y="305" width="445" height="48" rx="10" fill="#edf3ed" stroke="none"/><text x="428" y="336" font-size="19" fill="#146e6e" text-anchor="start" font-weight="650">离群值 / 延迟</text><text x="610" y="336" font-size="18" fill="#182e35" text-anchor="start" font-weight="400">失效与时间行为</text><text x="450" y="410" font-size="19" fill="#182e35" text-anchor="middle" font-weight="400">误差很小但大量像素被丢弃，不能等价于整幅场景性能良好</text><text x="35" y="442" font-size="15" fill="#5e7478" text-anchor="start" font-weight="400">自绘教学示意 · 非实验数据；几何及波形未按比例绘制</text></g></svg>