<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">相同的光输入，两种不同的测量输出</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#146e6e"/></marker></defs><rect width="900" height="440" fill="#fbfaf6"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="38" font-size="25" fill="#182e35" text-anchor="start" font-weight="650">相同的光输入，两种不同的测量输出</text><rect x="30" y="70" width="410" height="300" rx="10" fill="#edf3ed" stroke="none"/><rect x="460" y="70" width="410" height="300" rx="10" fill="#edf3ed" stroke="none"/><text x="52" y="105" font-size="23" fill="#182e35" text-anchor="start" font-weight="650">积分 CMOS：累计电荷</text><text x="480" y="105" font-size="23" fill="#182e35" text-anchor="start" font-weight="650">SPAD：记录事件</text><circle cx="70" cy="140" r="5" fill="#c28a35"/><line x1="70" y1="150" x2="105" y2="205" stroke="#c28a35" stroke-width="1.5"/><circle cx="115" cy="135" r="5" fill="#c28a35"/><line x1="115" y1="145" x2="150" y2="205" stroke="#c28a35" stroke-width="1.5"/><circle cx="160" cy="145" r="5" fill="#c28a35"/><line x1="160" y1="155" x2="195" y2="205" stroke="#c28a35" stroke-width="1.5"/><circle cx="205" cy="140" r="5" fill="#c28a35"/><line x1="205" y1="150" x2="240" y2="205" stroke="#c28a35" stroke-width="1.5"/><circle cx="250" cy="133" r="5" fill="#c28a35"/><line x1="250" y1="143" x2="285" y2="205" stroke="#c28a35" stroke-width="1.5"/><polyline points="100,195 100,285 315,285 315,195" fill="none" stroke="#146e6e" stroke-width="4"/><rect x="105" y="237" width="205" height="44" rx="0" fill="#9fc9bc" stroke="none"/><text x="150" y="225" font-size="22" fill="#182e35" text-anchor="start" font-weight="400">电子数 N</text><text x="76" y="340" font-size="18" fill="#5e7478" text-anchor="start" font-weight="400">读出值 Sᵧ = KN；噪声以电子折算</text><line x1="490" y1="250" x2="840" y2="250" stroke="#5e7478" stroke-width="2" marker-end="url(#arr)"/><polyline points="512,250 512,180 528,180 528,250" fill="none" stroke="#146e6e" stroke-width="3"/><polyline points="570,250 570,180 586,180 586,250" fill="none" stroke="#146e6e" stroke-width="3"/><polyline points="692,250 692,180 708,180 708,250" fill="none" stroke="#146e6e" stroke-width="3"/><polyline points="782,250 782,180 798,180 798,250" fill="none" stroke="#146e6e" stroke-width="3"/><text x="530" y="295" font-size="22" fill="#182e35" text-anchor="start" font-weight="400">事件数 / 到达时刻</text><text x="482" y="340" font-size="18" fill="#5e7478" text-anchor="start" font-weight="400">PDE = 有效填充比例 × 有源区 PDP</text><text x="630" y="230" font-size="16" fill="#c28a35" text-anchor="start" font-weight="400">恢复时间</text><text x="35" y="422" font-size="15" fill="#5e7478" text-anchor="start" font-weight="400">自绘教学示意 · 非实验数据；几何及波形未按比例绘制</text></g></svg>