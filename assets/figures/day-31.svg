<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">PDP 与 PDE：分母不同，指标就不同</title><desc id="desc">自绘定义示意；对应原书 PDF29 脚注3</desc><defs><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#146e6e"/></marker><marker id="goldArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#c28a35"/></marker><marker id="inkArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#182e35"/></marker><marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#b15d4f"/></marker></defs><rect width="900" height="450" fill="#fbfaf6"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="35" y="43" font-size="28" fill="#182e35" text-anchor="start" font-weight="700">PDP 与 PDE：分母不同，指标就不同</text><text x="35" y="76" font-size="18" fill="#5e7478" text-anchor="start" font-weight="400">自绘定义示意；对应原书 PDF29 脚注3</text><rect x="80" y="112" width="245" height="245" rx="0" fill="#fbfaf6" stroke="#182e35" stroke-width="2"/><rect x="125" y="157" width="155" height="155" rx="0" fill="#edf3ed" stroke="#146e6e" stroke-width="2"/><text x="202" y="147" font-size="22" fill="#182e35" text-anchor="middle" font-weight="400">整像素面积</text><text x="202" y="225" font-size="23" fill="#146e6e" text-anchor="middle" font-weight="400">有效探测区</text><text x="202" y="266" font-size="17" fill="#146e6e" text-anchor="middle" font-weight="400">FF = 有效区 / 像素区</text><circle cx="95" cy="125" r="6" fill="#c28a35" stroke="#c28a35" stroke-width="1"/><circle cx="140" cy="179" r="6" fill="#c28a35" stroke="#c28a35" stroke-width="1"/><circle cx="194" cy="205" r="6" fill="#c28a35" stroke="#c28a35" stroke-width="1"/><circle cx="258" cy="286" r="6" fill="#c28a35" stroke="#c28a35" stroke-width="1"/><circle cx="301" cy="320" r="6" fill="#c28a35" stroke="#c28a35" stroke-width="1"/><circle cx="277" cy="139" r="6" fill="#c28a35" stroke="#c28a35" stroke-width="1"/><line x1="358" y1="232" x2="436" y2="232" stroke="#c28a35" stroke-width="3" marker-end="url(#goldArrow)"/><rect x="463" y="125" width="350" height="102" rx="12" fill="#edf3ed" stroke="#cbd9d2" stroke-width="2"/><text x="638" y="165" font-size="23" fill="#182e35" text-anchor="middle" font-weight="400">落在有效区 ≠ 一定触发</text><text x="638" y="198" font-size="20" fill="#5e7478" text-anchor="middle" font-weight="400">PDP：载流子触发事件的概率</text><text x="635" y="285" font-size="30" fill="#146e6e" text-anchor="middle" font-weight="700">PDE = FF × PDP</text><text x="635" y="329" font-size="23" fill="#182e35" text-anchor="middle" font-weight="400">效率必须说明参考面积</text><text x="80" y="409" font-size="20" fill="#5e7478" text-anchor="start" font-weight="400">定义示意：不含镜头透过率、死时间和后级读出损失。</text></g></svg>