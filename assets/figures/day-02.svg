<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="QE 的分母：完整像素面积，而非只看感光区"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#146e6e"/></marker></defs><rect width="900" height="400" rx="18" fill="#fbfaf6"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif" fill="#182e35"><text x="40" y="45" font-size="25" font-weight="700">QE 的分母：完整像素面积，而非只看感光区</text><rect x="100" y="98" width="230" height="230" rx="4" fill="#e5ede7" stroke="#146e6e" stroke-width="3"/><rect x="152" y="150" width="126" height="126" fill="#146e6e" opacity=".65"/><path d="M100 82H330" stroke="#182e35" stroke-width="2"/><text x="145" y="76" font-size="18">像素完整面积 A</text><text x="171" y="219" font-size="19" fill="white">感光区</text><path d="M365 205H444" stroke="#146e6e" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="137" font-size="23" font-weight="650">入射光子 μₚ → 光生电子 μₑ</text><text x="480" y="194" font-size="30" fill="#146e6e">η = μₑ / μₚ</text><text x="480" y="245" font-size="19">μₚ 按整个像素占地面积计数</text><text x="480" y="282" font-size="19">填充因子与微透镜的影响已包含在 η 中</text><text x="100" y="372" font-size="15" fill="#5e7478">自绘示意；面积比例不代表具体器件填充率。依据 EMVA 1288 R3.1 §2.1，PDF p.5。</text></g></svg>