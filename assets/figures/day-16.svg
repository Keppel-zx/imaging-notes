<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">阴影校正：增益改变均值，也放大噪声</title><desc id="desc">自绘教学示意，非实验数据。阴影校正：增益改变均值，也放大噪声</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#146e6e"/></marker><radialGradient id="shade"><stop offset="0" stop-color="#faf7da"/><stop offset="1" stop-color="#485b55"/></radialGradient><radialGradient id="gain"><stop offset="0" stop-color="#9ecdc5"/><stop offset="1" stop-color="#f2d29f"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="3"/></filter></defs><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#182e35}.t{font-size:23px;font-weight:650}.s{font-size:18px;fill:#5e7478}.a{stroke:#5e7478;stroke-width:1.5;fill:none}.l{stroke:#146e6e;stroke-width:3;fill:none}.g{stroke:#c28a35;stroke-width:3;fill:none}.box{fill:#edf3ed;stroke:#b5ccc1;stroke-width:1.5}.num{font-size:25px;fill:#146e6e}</style><rect width="900" height="430" rx="18" fill="#fbfaf6"/><text class="t" x="35" y="42">阴影校正：增益改变均值，也放大噪声</text><text class="t" x="45" y="95" text-anchor="start">原始均匀场响应</text><rect x="45" y="120" width="235" height="170" rx="10" fill="url(#shade)" stroke="#b5ccc1"/><text class="num" x="303" y="220" text-anchor="middle">×</text><text class="t" x="335" y="95" text-anchor="start">位置相关增益</text><rect x="335" y="120" width="235" height="170" rx="10" fill="url(#gain)" stroke="#b5ccc1"/><text class="num" x="593" y="220" text-anchor="middle">=</text><text class="t" x="625" y="95" text-anchor="start">校正后均值</text><rect x="625" y="120" width="235" height="170" rx="10" fill="#d8ddbf" stroke="#b5ccc1"/><text class="s" x="45" y="338" text-anchor="start">校正平均亮度，不代表边角获得了更多光子</text><text class="s" x="45" y="368" text-anchor="start">固定增益 g 同时使噪声标准差变为 gσ</text><text class="s" x="35" y="410">自绘教学示意 · 非实验数据</text></svg>