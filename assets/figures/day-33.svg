<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">阵列事件必须先被接收，才能得到时间码</title><desc id="desc">自绘示意，非实验数据</desc><defs><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#146e6e"/></marker><marker id="goldArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#c28a35"/></marker><marker id="inkArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#182e35"/></marker><marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#b15d4f"/></marker></defs><rect width="900" height="450" fill="#fbfaf6"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="35" y="43" font-size="28" fill="#182e35" text-anchor="start" font-weight="700">阵列事件必须先被接收，才能得到时间码</text><text x="35" y="76" font-size="18" fill="#5e7478" text-anchor="start" font-weight="400">自绘示意，非实验数据</text><rect x="65" y="110" width="120" height="42" rx="12" fill="#edf3ed" stroke="#cbd9d2" stroke-width="2"/><text x="125" y="139" font-size="21" fill="#182e35" text-anchor="middle" font-weight="400">像素 1</text><line x1="185" y1="132" x2="285" y2="222" stroke="#146e6e" stroke-width="2"/><rect x="65" y="170" width="120" height="42" rx="12" fill="#edf3ed" stroke="#cbd9d2" stroke-width="2"/><text x="125" y="199" font-size="21" fill="#182e35" text-anchor="middle" font-weight="400">像素 2</text><line x1="185" y1="192" x2="285" y2="222" stroke="#146e6e" stroke-width="2"/><rect x="65" y="230" width="120" height="42" rx="12" fill="#edf3ed" stroke="#cbd9d2" stroke-width="2"/><text x="125" y="259" font-size="21" fill="#182e35" text-anchor="middle" font-weight="400">像素 3</text><line x1="185" y1="252" x2="285" y2="222" stroke="#146e6e" stroke-width="2"/><rect x="65" y="290" width="120" height="42" rx="12" fill="#edf3ed" stroke="#cbd9d2" stroke-width="2"/><text x="125" y="319" font-size="21" fill="#182e35" text-anchor="middle" font-weight="400">像素 4</text><line x1="185" y1="312" x2="285" y2="222" stroke="#146e6e" stroke-width="2"/><rect x="285" y="188" width="125" height="65" rx="12" fill="#edf3ed" stroke="#cbd9d2" stroke-width="2"/><text x="347" y="230" font-size="21" fill="#182e35" text-anchor="middle" font-weight="400">4:1 复用</text><line x1="410" y1="220" x2="480" y2="220" stroke="#146e6e" stroke-width="3" marker-end="url(#tealArrow)"/><rect x="485" y="171" width="150" height="100" rx="12" fill="#edf3ed" stroke="#cbd9d2" stroke-width="2"/><text x="560" y="211" font-size="24" fill="#146e6e" text-anchor="middle" font-weight="400">共享 TDC</text><text x="560" y="247" font-size="16" fill="#5e7478" text-anchor="middle" font-weight="400">一次接收能力有限</text><line x1="650" y1="220" x2="718" y2="220" stroke="#c28a35" stroke-width="3" marker-end="url(#goldArrow)"/><text x="755" y="210" font-size="24" fill="#c28a35" text-anchor="middle" font-weight="400">时间码</text><text x="755" y="247" font-size="21" fill="#5e7478" text-anchor="middle" font-weight="400">Δt：码宽</text><line x1="405" y1="330" x2="405" y2="355" stroke="#5e7478" stroke-width="2"/><line x1="447" y1="330" x2="447" y2="355" stroke="#5e7478" stroke-width="2"/><line x1="489" y1="330" x2="489" y2="355" stroke="#5e7478" stroke-width="2"/><line x1="531" y1="330" x2="531" y2="355" stroke="#5e7478" stroke-width="2"/><line x1="573" y1="330" x2="573" y2="355" stroke="#5e7478" stroke-width="2"/><line x1="615" y1="330" x2="615" y2="355" stroke="#5e7478" stroke-width="2"/><line x1="657" y1="330" x2="657" y2="355" stroke="#5e7478" stroke-width="2"/><line x1="699" y1="330" x2="699" y2="355" stroke="#5e7478" stroke-width="2"/><line x1="741" y1="330" x2="741" y2="355" stroke="#5e7478" stroke-width="2"/><line x1="405" y1="342" x2="745" y2="342" stroke="#182e35" stroke-width="2"/><text x="404" y="392" font-size="23" fill="#182e35" text-anchor="start" font-weight="400">量化步长 ≠ 抖动 ≠ 吞吐率</text><text x="60" y="410" font-size="18" fill="#5e7478" text-anchor="start" font-weight="400">共享结构依据原书图7作教学改绘，不表示特定芯片的全部实现。</text></g></svg>